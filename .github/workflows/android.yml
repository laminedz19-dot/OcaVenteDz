name: OcaVenteDz Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APKs?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build OcaVenteDz (User App APK)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build OcaVenteDz Admin (Admin App APK)
        run: ./gradlew :admin:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/OcaVenteDz-User-App-debug.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk release-apks/OcaVenteDz-Admin-App-debug.apk
          ls -lh release-apks/

      - name: Upload User App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OcaVenteDz-User-App-debug
          path: release-apks/OcaVenteDz-User-App-debug.apk
          retention-days: 14

      - name: Upload Admin App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OcaVenteDz-Admin-App-debug
          path: release-apks/OcaVenteDz-Admin-App-debug.apk
          retention-days: 14

      - name: Upload Both APKs as Combined Bundle
        uses: actions/upload-artifact@v4
        with:
          name: OcaVenteDz-All-APKs
          path: release-apks/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: release-apks/*.apk
          body: |
            ### OcaVenteDz Applications Release v1.0.${{ github.run_number }}
            
            This release contains the debug builds of both completely separated applications:
            - **OcaVenteDz-User-App-debug.apk**: The marketplace app for regular users, buyers, and sellers across 69 wilayas.
            - **OcaVenteDz-Admin-App-debug.apk**: The standalone admin control panel for approving ads, verifying CCP/BaridiMob payment receipts, and user management.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
