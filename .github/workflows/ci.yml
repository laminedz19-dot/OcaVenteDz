name: ocaventeDz Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  zero-firebase-check:
    name: Strict Zero-Firebase Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assert Absolutely No Firebase Or Google Services Config
        run: |
          echo "Verifying 100% independence from Firebase..."
          
          # Check for forbidden google-services.json
          if [ -f "app/google-services.json" ] || [ -f "google-services.json" ]; then
            echo "ERROR: google-services.json found! Firebase is strictly forbidden."
            exit 1
          fi

          # Check for forbidden gradle plugins and SDK dependencies in build files
          for pattern in "com.google.gms.google-services" "com.google.firebase" "firebase-bom" "firebase-auth" "firebase-firestore" "firebase-storage" "firebase-messaging"; do
            if grep -rn --exclude-dir={.git,.github,build} --exclude="ci.yml" "$pattern" . ; then
              echo "ERROR: Forbidden Firebase pattern '$pattern' found in repository!"
              exit 1
            fi
          done

          echo "SUCCESS: Zero Firebase dependencies confirmed! ocaventeDz is completely independent."

  backend-build-test:
    name: Build & Test Backend (Node.js + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate --schema=../database/schema.prisma

      - name: Build Backend (TypeScript)
        working-directory: ./backend
        run: npm run build

      - name: Test Backend
        working-directory: ./backend
        run: npm test

  android-apps-build:
    name: Build Android User App & Admin App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Assemble User App (:app:assembleDebug)
        run: ./gradlew :app:assembleDebug

      - name: Assemble Admin App (:admin:assembleDebug)
        run: ./gradlew :admin:assembleDebug

      - name: Verify APK Artifacts Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          ls -la admin/build/outputs/apk/debug/
          echo "Both ocaventeDz User & Admin APKs built successfully!"
